<title>Bunny Babe WhatsApp Bot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a WhatsApp-style phone chat — fixed header + scrolling thread + input bar; committed to WhatsApp's own look, theme-aware light/dark */
:root{
  --page:#d9dde1; --chat:#efe7de; --wall:#efe7de;
  --head:#008069; --head-ink:#ffffff;
  --in:#ffffff; --in-ink:#111b21; --out:#d9fdd3; --out-ink:#111b21;
  --meta:#667781; --line:#d8d8d8; --opt:#ffffff; --opt-ink:#008069; --opt-line:#c7d0ce;
  --pink:#FF5CB8; --note:#fff7cf; --note-ink:#4a3f00; --note-line:#111;
  --body:"Inter",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b141a; --chat:#0b141a; --wall:#0b141a;
  --head:#202c33; --head-ink:#e9edef;
  --in:#202c33; --in-ink:#e9edef; --out:#005c4b; --out-ink:#e9edef;
  --meta:#8696a0; --line:#222d34; --opt:#202c33; --opt-ink:#53bdeb; --opt-line:#2a3942;
  --note:#2a2410; --note-ink:#f0e6b8; --note-line:#4a4320; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#0b141a; --chat:#0b141a; --wall:#0b141a;
  --head:#202c33; --head-ink:#e9edef;
  --in:#202c33; --in-ink:#e9edef; --out:#005c4b; --out-ink:#e9edef;
  --meta:#8696a0; --line:#222d34; --opt:#202c33; --opt-ink:#53bdeb; --opt-line:#2a3942;
  --note:#2a2410; --note-ink:#f0e6b8; --note-line:#4a4320; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);font-family:var(--body);color:var(--in-ink)}
.shell{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--chat);
  background-image:radial-gradient(var(--line) .5px,transparent .5px);background-size:22px 22px}
.note{background:var(--note);color:var(--note-ink);border-bottom:2px solid var(--note-line);
  padding:9px max(14px,env(safe-area-inset-left,0px)) 9px max(14px,env(safe-area-inset-right,0px));
  font-size:12.5px;font-weight:600;text-align:center}
.hdr{background:var(--head);color:var(--head-ink);display:flex;align-items:center;gap:10px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));flex:none}
.hdr .av{width:38px;height:38px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px;flex:none}
.hdr .who{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.hdr .who b{font-size:16px}
.hdr .who small{font-size:12px;opacity:.85}
.hdr .sp{margin-left:auto;display:flex;gap:16px;opacity:.95}
.thread{flex:1;overflow-y:auto;padding:14px max(10px,env(safe-area-inset-left,0px)) 10px max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.day{align-self:center;background:var(--in);color:var(--meta);font-size:11px;font-weight:600;padding:4px 10px;border-radius:8px;margin:2px 0 8px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.row{display:flex;max-width:82%}
.row.in{align-self:flex-start}
.row.out{align-self:flex-end}
.bub{padding:7px 10px 6px;border-radius:10px;font-size:14.5px;line-height:1.42;box-shadow:0 1px .5px rgba(0,0,0,.12);position:relative;white-space:pre-wrap;word-wrap:break-word}
.in .bub{background:var(--in);color:var(--in-ink);border-top-left-radius:2px}
.out .bub{background:var(--out);color:var(--out-ink);border-top-right-radius:2px}
.bub .t{display:block;text-align:right;font-size:10.5px;color:var(--meta);margin-top:2px}
.bub b{font-weight:700}
.opts{align-self:flex-start;display:flex;flex-direction:column;gap:6px;max-width:82%;width:100%;margin:2px 0 6px}
.opt{background:var(--opt);color:var(--opt-ink);border:1px solid var(--opt-line);border-radius:9px;padding:11px 12px;
  font-size:14.5px;font-weight:700;cursor:pointer;text-align:center;box-shadow:0 1px .5px rgba(0,0,0,.1);width:100%;
  display:flex;align-items:center;justify-content:center;gap:7px}
.opt:active{transform:scale(.99)}
.opt:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.opt.row2{flex-direction:row;flex-wrap:wrap}
.qr{align-self:flex-start;background:var(--in);border-radius:10px;padding:10px;max-width:260px;box-shadow:0 1px .5px rgba(0,0,0,.12)}
.qr svg{display:block;width:100%;height:auto;border-radius:6px}
.qr .cap{font-size:12px;color:var(--meta);text-align:center;margin-top:6px;font-weight:600}
.typing .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--meta);margin:0 1px;animation:bl 1.1s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.inbar{flex:none;display:flex;gap:8px;align-items:center;background:var(--chat);
  padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
.inbar .box{flex:1;background:var(--in);color:var(--in-ink);border:0;border-radius:22px;padding:11px 14px;font-size:14.5px;font-family:inherit;min-width:0}
.inbar .box:disabled{opacity:.65}
.inbar .send{width:44px;height:44px;border-radius:50%;background:var(--head);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.inbar .send:disabled{opacity:.5;cursor:default}
@media(prefers-reduced-motion:reduce){.typing .dot{animation:none}.opt:active{transform:none}}
</style>

<div class="shell">
  <div class="note">👀 Simulasi bot — tap butang untuk cuba. Bot sebenar perlu WhatsApp Business API; bayaran hantar QR + link CHIP dalam chat.</div>
  <div class="hdr">
    <div class="av">BB</div>
    <div class="who"><b>Bunny Babe</b><small id="status">online</small></div>
    <div class="sp" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 15.5c-1.2 0-2.5-.2-3.6-.6a1 1 0 0 0-1 .2l-2.2 2.2a15 15 0 0 1-6.6-6.6l2.2-2.2a1 1 0 0 0 .2-1C8.7 6.5 8.5 5.2 8.5 4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1 17 17 0 0 0 17 17 1 1 0 0 0 1-1v-3.5a1 1 0 0 0-1-1z"/></svg>
    </div>
  </div>
  <div class="thread" id="thread" aria-live="polite"></div>
  <form class="inbar" id="inbar">
    <input class="box" id="box" type="text" placeholder="Pilih butang di atas ↑" autocomplete="off" disabled>
    <button class="send" id="send" type="submit" disabled aria-label="Hantar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5l18-8.5L3 3.5 3 10l13 2-13 2z"/></svg>
    </button>
  </form>
</div>

<script>
(function(){
  var WA="60176842008", UNIT=39, DUO=59, PACK=99, SHIP=5, FREE_MIN=2;
  var SCENTS=[
    {name:"Vanilla", sku:"BB-VANILLA", mood:"warm & cozy", emo:"🤍"},
    {name:"Secret",  sku:"BB-SECRET",  mood:"bold & sweet", emo:"🧡"},
    {name:"Aurelle", sku:"BB-AURELLE", mood:"soft & feminine", emo:"🌸"},
    {name:"Marsh",   sku:"BB-MARSH",   mood:"super manja", emo:"🍓"},
    {name:"Swift",   sku:"BB-SWIFT",   mood:"fresh & playful", emo:"🍏"}
  ];
  var cart={}, pending=null, addr="";
  var thread=document.getElementById("thread");
  var box=document.getElementById("box"), send=document.getElementById("send"), inbar=document.getElementById("inbar");
  var ask=null; // what a typed message means right now

  function money(n){return "RM"+(Math.round(n*100)/100).toFixed(2).replace(/\.00$/,"");}
  function bundle(n){var p=Math.floor(n/5),r=n%5,d=Math.floor(r/2),s=r%2;return p*PACK+d*DUO+s*UNIT;}
  function count(){var n=0;for(var k in cart)n+=cart[k];return n;}
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function total(){var n=count();return bundle(n)+(n>=FREE_MIN?0:SHIP);}
  function topUpTo(target){var g=0;while(count()<target&&g<50){var ch=null,mn=1e9;SCENTS.forEach(function(s){var q=cart[s.sku]||0;if(q<mn){mn=q;ch=s;}});cart[ch.sku]=(cart[ch.sku]||0)+1;g++;}}
  function now(){var d=new Date();return (d.getHours()%12||12)+":"+String(d.getMinutes()).padStart(2,"0")+(d.getHours()<12?" AM":" PM");}
  function scrollDown(){thread.scrollTop=thread.scrollHeight;}

  function bubble(side,html){
    var row=document.createElement("div"); row.className="row "+side;
    row.innerHTML='<div class="bub">'+html+'<span class="t">'+now()+(side==="out"?' ✓✓':'')+'</span></div>';
    thread.appendChild(row); scrollDown(); return row;
  }
  function options(list){
    var wrap=document.createElement("div"); wrap.className="opts";
    list.forEach(function(o){
      var b=document.createElement("button"); b.type="button"; b.className="opt"; b.innerHTML=o.label;
      b.addEventListener("click",function(){ wrap.remove(); o.fn(); });
      wrap.appendChild(b);
    });
    thread.appendChild(wrap); scrollDown(); return wrap;
  }
  function qrCard(amount){
    var wrap=document.createElement("div"); wrap.className="qr";
    var n=25, cells="";
    for(var y=0;y<n;y++)for(var x=0;x<n;x++){
      var edge=(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
      var on=edge?((x%6===0||y%6===0)||(x>1&&x<5&&y>1&&y<5)||(x>n-6&&x<n-2&&y>1&&y<5)||(x>1&&x<5&&y>n-6&&y<n-2)):(Math.random()>.5);
      if(on)cells+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';
    }
    wrap.innerHTML='<svg viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges" fill="#111"><rect width="'+n+'" height="'+n+'" fill="#fff"/>'+cells+'</svg><div class="cap">DuitNow QR (contoh) · '+amount+'</div>';
    thread.appendChild(wrap); scrollDown();
  }
  function typing(fn,delay){
    var row=document.createElement("div"); row.className="row in";
    row.innerHTML='<div class="bub typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    thread.appendChild(row); scrollDown();
    setTimeout(function(){ row.remove(); fn(); }, delay||650);
  }
  function enableInput(placeholder){ ask=placeholder.k; box.disabled=false; send.disabled=false; box.placeholder=placeholder.p; box.focus(); }
  function disableInput(){ ask=null; box.disabled=true; send.disabled=true; box.value=""; box.placeholder="Pilih butang di atas ↑"; }

  /* ---- Flow ---- */
  function start(){
    typing(function(){
      bubble("in","Haii babe! 🐰💕 Welcome to <b>Bunny Babe</b> — eau de parfum 30ml, cute n chaos ✨");
      typing(function(){
        bubble("in","Satu botol RM39, tapi babe... lagi banyak lagi murah 😉\nJom pilih wangian! Mix mana-mana pun boleh 👇");
        scentMenu();
      },800);
    });
  }
  function scentMenu(){
    var list=SCENTS.map(function(s){return {label:s.emo+" "+s.name+" — <i>"+s.mood+"</i>", fn:function(){pickQty(s);}};});
    list.push({label:"🎀 Terus Babe Pack (5 botol · RM99)", fn:function(){ userSaid("Nak Babe Pack 5 botol 🎀"); topUpTo(5); bigpack(); }});
    options(list);
  }
  function pickQty(s){
    userSaid(s.name);
    typing(function(){
      bubble("in", pick([
        "Eh "+s.name+" ni best gilaa 😍 Berapa botol babe?",
        s.name+" memang laku 🔥 Nak berapa botol?",
        "Good choiceee! "+s.name+" fav ramai orang. Berapa botol ya?"
      ]));
      options([
        {label:"1 botol", fn:function(){ addScent(s,1); }},
        {label:"2 botol 💕", fn:function(){ addScent(s,2); }},
        {label:"3 botol", fn:function(){ addScent(s,3); }},
        {label:"5 botol 🎀", fn:function(){ addScent(s,5); }}
      ]);
    });
  }
  function addScent(s,q){ cart[s.sku]=(cart[s.sku]||0)+q; userSaid(q+" botol "+s.name); afterAdd(q+"× "+s.name); }

  function afterAdd(what){
    var n=count();
    typing(function(){
      bubble("in","Dah masuk bakul: <b>"+what+"</b> ✓");
      if(n<2){
        // Upsell → DUO
        typing(function(){
          bubble("in", pick([
            "Eh jap 👀 tambah <b>1 botol je lagi</b> terus jadi <b>2 botol RM59</b> (bukan RM78) + <b>pos FREE</b> 🚚\nJimat RM24 tau babe, rugi kalau tak amik 😭",
            "Psst 🤫 kalau 2 botol — RM59 + <b>shipping FREE</b>. Boleh pilih scent lain, sepasang lagi cantik 😍 Nak tambah?"
          ]));
          options([
            {label:"💘 Okay tambah 1 lagi", fn:function(){ userSaid("Nak tambah 1 lagi"); typing(scentMenu); }},
            {label:"Tak pe, 1 botol je dulu", fn:checkout}
          ]);
        },800);
      } else if(n<5 && n%5!==0){
        // Upsell → BABE PACK
        var save=5*UNIT-PACK;
        typing(function(){
          bubble("in","Mantap, "+n+" botol dah masuk ✓\n\nTapi babe... 🎀 <b>Babe Pack 5 botol RM99</b> je — <b>RM19.80 sebotol</b> + FREE tester 5ml 🎁\nTambah "+(5-n)+" lagi → collect semua 5 scent & jimat sampai RM"+save+"! Naik tak? 💅");
          options([
            {label:"🎀 Naik Babe Pack (5 botol)", fn:function(){ userSaid("Naikkan ke Babe Pack 🎀"); topUpTo(5); bigpack(); }},
            {label:"Cukup la, checkout ("+money(total())+")", fn:checkout}
          ]);
        },800);
      } else {
        // 5, 10, ... — praise, no pushy upsell
        typing(function(){
          bubble("in", pick(["Borong mode ON 😍👑","Haaa macam ni baru best 🔥","Babe sejati ni ✨"])+"\n\n"+summary()+"\n\nNak tambah lagi ke terus checkout?");
          options([
            {label:"➕ Tambah wangian", fn:function(){ userSaid("Tambah lagi"); typing(scentMenu); }},
            {label:"✅ Checkout ("+money(total())+")", fn:checkout}
          ]);
        },650);
      }
    });
  }

  function bigpack(){
    typing(function(){
      bubble("in","Cantikkk! 🎀 Babe Pack lengkap — 5 wangian, satu untuk setiap mood 💖");
      typing(function(){
        bubble("in", summary()+"\n\nJom checkout? ✨");
        options([
          {label:"✅ Checkout ("+money(total())+")", fn:checkout},
          {label:"➕ Nak tukar/tambah scent", fn:function(){ userSaid("Nak ubah sikit"); typing(scentMenu); }}
        ]);
      },700);
    },800);
  }
  function summary(){
    var lines=[], n=count();
    SCENTS.forEach(function(s){ if(cart[s.sku]) lines.push("• "+cart[s.sku]+"× "+s.name+" ("+s.sku+")"); });
    var ship=n>=FREE_MIN?"FREE":money(SHIP);
    lines.push("—");
    lines.push("Barang: <b>"+money(bundle(n))+"</b>");
    lines.push("Shipping: <b>"+ship+"</b>");
    return lines.join("\n");
  }
  function checkout(){
    userSaid("Checkout");
    var n=count();
    typing(function(){
      if(n<FREE_MIN){ bubble("in","Okok 😚 (btw kalau 2 botol pos FREE tau, tapi takpe kalau babe nak 1 je ❤️)"); }
      typing(function(){
        bubble("in","Siapp! 🥳 Nak pos ke mana babe? Taip <b>nama + alamat penuh + poskod</b> dalam satu mesej ya 📦");
        enableInput({k:"addr",p:"cth: Aina, No 12 Jalan Mawar, Shah Alam, 40000"});
      }, n<FREE_MIN?700:300);
    });
  }
  function afterAddr(text){
    addr=text; userSaid(text); disableInput();
    var due=total();
    typing(function(){
      bubble("in","Noted sayang! ✍️ Alamat dah kami simpan.");
      typing(function(){
        bubble("in","<b>Ringkasan order kamu</b>\n"+summary()+"\n━━━━━━\n<b>Jumlah bayar: "+money(due)+"</b>\n\nNak bayar guna apa? 👇");
        options([
          {label:"📱 DuitNow QR (scan je)", fn:function(){ payQR(due); }},
          {label:"💳 CHIP — FPX / kad / e-wallet", fn:function(){ payCHIP(due); }}
        ]);
      },600);
    });
  }
  function payQR(due){
    userSaid("Nak bayar DuitNow QR");
    typing(function(){
      bubble("in","Senang! Scan QR ni & bayar <b>"+money(due)+"</b> 👇");
      qrCard(money(due));
      typing(function(){
        bubble("in","Dah bayar, snap <b>screenshot resit</b> hantar sini ya 🧾 kami confirm terus ✨");
        options([{label:"✅ Dah bayar, ni resit saya", fn:function(){ userSaid("[📷 gambar resit]"); done(false); }}]);
      },600);
    },800);
  }
  function payCHIP(due){
    userSaid("Nak bayar CHIP");
    typing(function(){
      bubble("in","Okok! Klik link ni untuk bayar <b>"+money(due)+"</b> — boleh FPX, kad, Touch n Go, GrabPay semua 👇\n\n🔗 pay.bunnybabe.my/chip/xxxx");
      options([{label:"🔒 Buka link bayar (contoh)", fn:function(){ userSaid("Dah bayar via CHIP ✓"); done(true); }}]);
    },800);
  }
  function done(auto){
    typing(function(){
      var ref="BB"+Math.floor(1000+Math.random()*9000);
      bubble("in","Yayyy! 🎉 Order <b>#"+ref+"</b> dah kami terima"+(auto?" & bayaran confirmed ✓":"\nKami semak resit sekejap ya 👀")+"");
      typing(function(){
        bubble("in","Kami pos esok & hantar no. tracking kat sini 📦 Terima kasih sayang, enjoy your scents! 🐰💕");
      },700);
    },700);
  }

  function userSaid(t){ bubble("out", t.replace(/</g,"&lt;")); }

  inbar.addEventListener("submit",function(e){
    e.preventDefault();
    var v=box.value.trim(); if(!v||!ask)return;
    if(ask==="addr") afterAddr(v);
  });

  var day=document.createElement("div"); day.className="day"; day.textContent="TODAY"; thread.appendChild(day);
  start();
})();
</script>
